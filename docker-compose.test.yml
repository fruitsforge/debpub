services:
  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5

  sftp:
    build:
      context: .
      dockerfile: test/sftp.Dockerfile
    ports:
      - "2222:22"

  test-runner:
    build:
      context: .
      target: test-env
    depends_on:
      minio:
        condition: service_healthy
      sftp:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: debian-test
      SFTP_HOST: sftp
      SFTP_PORT: 22
      SFTP_USER: testuser
      SFTP_PASSWORD: testpassword
      SFTP_BASEPATH: /home/testuser/debian
      INTEGRATION_TEST: "1"
    volumes:
      - .:/workspace
    entrypoint: ["/bin/bash", "/workspace/test/integration/run.sh"]
